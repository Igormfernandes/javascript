<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body{
            background-color: lightgray;
            color: black; /* Comentário em CSS */
            font: normal 20pt arial;
        }

        h1{
            color:  purple;
        }
    </style>
</head>
<body>
    <h1>Olá,Mundo!</h1>
    <p>já me livrei da maldição</p>
    <script>
        var n1 = Number.parseInt(window.prompt('Digite um número: ')) //String
        var n2 = Number.parseInt(window.prompt('Digite outro número:')) //String
        var s = n1 + n2
        //window.alert('A soma dos valores é ' + s) // concatenação 
        // + ( number + number) para adição
        // + (stringer + stringer) para concatenação
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
    </script>
</body>
</html>
